[package]
name = "makerfoundry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "MakerFoundry: a marketplace for machine-embroidery designs and laser-cut files"

[[bin]]
name = "makerfoundry"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# json: the apps' API (MF-7) answers JSON
axum = { workspace = true, features = ["json"] }
tokio = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
getrandom = { workspace = true }
sf-formats = { workspace = true }
sf-core = { workspace = true }
usvg = { workspace = true }
lopdf = { workspace = true }
image = { workspace = true }
rusty-s3 = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
# The tests' stand-in for StitchFoundry's account service answers JSON.
axum = { workspace = true, features = ["json"] }
tower = { workspace = true }
http-body-util = { workspace = true }
# Property tests of everything that reads untrusted input (tests/untrusted_input.rs). MIT OR Apache-2.0.
proptest = "1"
