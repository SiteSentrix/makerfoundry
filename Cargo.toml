[workspace]
resolver = "3"
members = ["apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/sitesentrix/makerfoundry"

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "form", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["set-header", "timeout", "limit"] }
http-body-util = "0.1"
# Postgres: MakerFoundry's own records (sessions, then listings); queries checked by tests, not macros.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
# HTTPS to StitchFoundry's account service.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Session ids: random bytes, kept only as their SHA-256.
sha2 = "0.10"
# Stripe webhook signatures: HMAC-SHA256 (MIT OR Apache-2.0).
hmac = "0.12"
getrandom = "0.3"
# SVG laser files: parsed and resolved (units, transforms, viewBox) by usvg, Apache-2.0 OR MIT. No
# default features: no fonts (text isn't drawn), and no svgz (gzip inside an upload is a bomb risk).
usvg = { version = "0.48", default-features = false }
# PDF laser files: lopdf, MIT, without its default features (no clock, no threads). Loaded with
# a cap on every decompressed stream; see laser/pdf.rs for the rest of the limits.
lopdf = { version = "0.45", default-features = false }
# Photos of the stitched or cut result: decoded, turned upright and saved again as JPEG (which drops
# their metadata, location included). MIT OR Apache-2.0; only the formats we take.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Files kept in Cloudflare R2 through its S3 API: rusty-s3 signs the requests (BSD-2-Clause), reqwest
# sends them.
rusty-s3 = "0.10"
url = "2"
# The apps' API (MF-7) takes design files as base64 in JSON. MIT OR Apache-2.0.
base64 = "0.22"
# StitchFoundry's embroidery file readers (DST, PES, JEF, EXP, VP3, XXX, U01 and more; fuzzed
# there against untrusted bytes) and its stitch statistics. MIT OR Apache-2.0, by SiteSentrix.
# Pinned by commit: bump on purpose.
sf-formats = { git = "https://github.com/Stitchwright/StitchFoundry", rev = "ef43e6cb27314d2c9028ab0d50a1bb64804f4bbb" }
sf-core = { git = "https://github.com/Stitchwright/StitchFoundry", rev = "ef43e6cb27314d2c9028ab0d50a1bb64804f4bbb" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
# MakerFoundry never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# CLAUDE.md › Never crash). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# Dependencies built optimised in dev and test builds too: image resizing and parsing are many
# times slower unoptimised (as StitchFoundry does).
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
